<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合言葉｜あごなし堂</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#E8EAE6;font-family:"Hiragino Sans","Yu Gothic",sans-serif;color:#16212B}
  .box{background:#fff;border:1px solid #C9CFC9;border-radius:4px;padding:34px 26px;
       width:min(340px,88vw);text-align:center}
  h1{font-size:17px;margin:0 0 6px;font-weight:600}
  p{font-size:13px;color:#5A6672;margin:0 0 18px}
  input{width:100%;box-sizing:border-box;padding:13px 12px;font-size:17px;text-align:center;
        border:1px solid #A8B0B8;border-radius:3px}
  input:focus{outline:2px solid #2F4E6F;border-color:#2F4E6F}
  button{width:100%;margin-top:12px;padding:14px;background:#2F4E6F;color:#fff;border:none;
         border-radius:3px;font-size:16px;font-weight:600;cursor:pointer}
  button:hover{background:#26405C}
  .err{color:#C1352B;font-size:13px;margin-top:12px;min-height:1.2em}
</style>
</head>
<body>
<div class="box">
  <h1>出版社別 10冊選定ツール</h1>
  <p>合言葉を入れてください</p>
  <input type="password" id="pw" autocomplete="off" autofocus>
  <button id="go">ひらく</button>
  <div class="err" id="err"></div>
</div>
<script>
async function unlock(){
  var err = document.getElementById("err");
  err.textContent = "";
  var pw = document.getElementById("pw").value;
  if(!pw) return;
  try{
    var d = await (await fetch("payload.json")).json();
    var b = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
    var keyMat = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt:b(d.salt), iterations:d.iter, hash:"SHA-256"},
      keyMat, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b(d.nonce)}, key, b(d.ct));
    document.open();
    document.write(new TextDecoder().decode(plain));
    document.close();
  }catch(e){
    err.textContent = "合言葉がちがいます";
  }
}
document.getElementById("go").onclick = unlock;
document.getElementById("pw").addEventListener("keydown", function(e){
  if(e.key === "Enter") unlock();
});
</script>
</body>
</html>
