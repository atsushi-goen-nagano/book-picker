<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出版社別 10冊選定ツール｜あごなし堂</title>
<style>
  :root{
    --ground:#E8EAE6;
    --card:#FFFFFF;
    --ink:#16212B;
    --ink-soft:#5A6672;
    --shu:#C1352B;
    --ai:#2F4E6F;
    --rule:#C9CFC9;
    --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
    --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:var(--gothic);
    font-size:16px;
    line-height:1.7;
    padding:0 0 190px;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 16px}

  /* ---- header ---- */
  header{
    background:var(--ai);
    color:#fff;
    padding:26px 0 22px;
    margin-bottom:22px;
  }
  header .wrap{display:flex;align-items:flex-start;gap:14px}
  .seal{
    flex:0 0 auto;width:54px;height:54px;border:2px solid var(--shu);
    background:var(--shu);color:#fff;border-radius:4px;
    font-family:var(--mincho);font-size:13px;font-weight:700;line-height:1.15;
    display:flex;align-items:center;justify-content:center;text-align:center;
    letter-spacing:.05em;
  }
  h1{
    font-family:var(--mincho);font-size:23px;font-weight:600;
    margin:0 0 4px;letter-spacing:.04em;line-height:1.35;
  }
  .sub{font-size:13px;color:#C3D0DE;margin:0;line-height:1.6}

  /* ---- panel ---- */
  .panel{
    background:var(--card);border:1px solid var(--rule);
    border-radius:3px;padding:18px 16px;margin-bottom:18px;
  }
  .eyebrow{
    font-size:11px;letter-spacing:.18em;color:var(--shu);
    font-weight:700;margin:0 0 10px;
  }
  label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px}
  input[type=text]{
    width:100%;padding:13px 12px;font-size:17px;font-family:var(--gothic);
    border:1px solid #A8B0B8;border-radius:3px;background:#fff;color:var(--ink);
  }
  input[type=text]:focus{outline:2px solid var(--ai);outline-offset:1px;border-color:var(--ai)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .chip{
    font-size:13px;padding:6px 11px;border:1px solid var(--rule);
    background:#F4F5F3;border-radius:14px;cursor:pointer;color:var(--ink-soft);
    font-family:var(--gothic);
  }
  .chip:hover,.chip:focus{border-color:var(--ai);color:var(--ai)}
  .btn{
    display:block;width:100%;margin-top:14px;padding:15px;
    background:var(--ai);color:#fff;border:none;border-radius:3px;
    font-size:16px;font-weight:600;font-family:var(--gothic);cursor:pointer;
    letter-spacing:.06em;
  }
  .btn:hover{background:#26405C}
  .btn:disabled{background:#9AA5AF;cursor:default}
  .btn.ghost{background:transparent;color:var(--ai);border:1px solid var(--ai)}
  .btn.ghost:hover{background:#EAF0F6}
  .btn.shu{background:var(--shu)}
  .btn.shu:hover{background:#A32B22}

  /* ---- counter (signature) ---- */
  .counter{
    position:sticky;top:0;z-index:20;background:var(--ground);
    padding:11px 0 9px;border-bottom:1px solid var(--rule);margin-bottom:14px;
  }
  .counter .wrap{display:flex;align-items:center;gap:12px}
  .beads{display:flex;gap:6px;flex:1}
  .bead{
    width:19px;height:19px;border-radius:50%;
    border:1.5px solid #A8B0B8;background:transparent;transition:background .18s;
  }
  .bead.on{background:var(--shu);border-color:var(--shu)}
  .count-num{font-family:var(--mincho);font-size:19px;white-space:nowrap}
  .count-num b{font-size:26px;color:var(--shu)}

  /* ---- results ---- */
  .slip{
    display:flex;gap:12px;background:var(--card);border:1px solid var(--rule);
    border-left:3px solid transparent;border-radius:2px;
    padding:12px 13px;margin-bottom:8px;cursor:pointer;
  }
  .slip.picked{border-left-color:var(--shu);background:#FDF7F6}
  .slip .no{
    flex:0 0 26px;height:26px;border:1px solid #A8B0B8;border-radius:2px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mincho);font-size:13px;color:var(--ink-soft);margin-top:2px;
  }
  .slip.picked .no{background:var(--shu);border-color:var(--shu);color:#fff}
  .slip .body{flex:1;min-width:0}
  .ttl{font-family:var(--mincho);font-size:16px;line-height:1.45;margin:0 0 4px;word-break:break-word}
  .meta{font-size:12px;color:var(--ink-soft);line-height:1.6;word-break:break-all}
  .meta .pub{color:var(--ai);font-weight:600}
  .meta .warn{color:var(--shu)}

  .status{
    font-size:14px;color:var(--ink-soft);text-align:center;
    padding:26px 12px;line-height:1.8;
  }
  .status strong{color:var(--ink)}
  .divider{
    display:flex;align-items:center;gap:10px;margin:22px 0 12px;
    font-size:12px;color:var(--ink-soft);letter-spacing:.1em;
  }
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--rule)}

  /* ---- output drawer ---- */
  .drawer{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--card);border-top:2px solid var(--ai);
    box-shadow:0 -4px 16px rgba(22,33,43,.12);
    max-height:82vh;overflow-y:auto;
  }
  .drawer .wrap{padding:14px 16px 20px}
  .drawer-head{
    display:flex;justify-content:space-between;align-items:center;
    font-family:var(--mincho);font-size:15px;
  }
  .drawer-toggle{
    background:none;border:none;color:var(--ai);font-size:14px;
    font-family:var(--gothic);cursor:pointer;padding:4px 2px;
  }
  .drawer-body{display:none;margin-top:12px}
  .drawer.open .drawer-body{display:block}
  textarea{
    width:100%;height:190px;padding:11px;font-size:13px;line-height:1.65;
    font-family:var(--gothic);border:1px solid #A8B0B8;border-radius:3px;
    background:#FBFBFA;color:var(--ink);resize:vertical;
  }
  .two{display:flex;gap:9px}
  .two .btn{flex:1}
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:auto;top:16px;
    background:var(--ink);color:#fff;padding:10px 20px;border-radius:3px;
    font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .22s;
  }
  .toast.show{opacity:1}
  .note{font-size:12px;color:var(--ink-soft);line-height:1.75;margin:10px 0 0}
  .note b{color:var(--shu)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="seal">選書<br>十冊</div>
    <div>
      <h1>出版社別 十冊 選定ツール</h1>
      <p class="sub">あごなし堂／Amazon 出品規制解除の発注用</p>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="panel">
    <p class="eyebrow">STEP 1　出版社をえらぶ</p>
    <label for="pub">出版社名を入れて「本をさがす」を押してください</label>
    <input type="text" id="pub" placeholder="例：日本文芸社" autocomplete="off">
    <div class="chips" id="chips"></div>
    <button class="btn" id="searchBtn">本をさがす</button>
    <p class="note">「株式会社」は付けても付けなくても大丈夫です。</p>
  </div>

</div>

<div class="counter" id="counter" hidden>
  <div class="wrap">
    <div class="beads" id="beads"></div>
    <div class="count-num"><b id="cnum">0</b> / 10冊</div>
  </div>
</div>

<div class="wrap">
  <div id="status" class="status">出版社名を入れて検索してください。</div>
  <div id="results"></div>
  <div id="more"></div>

  <div id="manualWrap" hidden>
    <div class="divider">手で足す</div>
    <div class="panel">
      <label for="manual">検索で出てこない本は、書名を直接入れて追加できます</label>
      <input type="text" id="manual" placeholder="書名を入力して Enter" autocomplete="off">
      <button class="btn ghost" id="manualBtn">この書名をリストに追加</button>
    </div>
  </div>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="wrap">
    <div class="drawer-head">
      <span>発注リスト（<span id="dcount">0</span>冊）</span>
      <button class="drawer-toggle" id="dtoggle">ひらく ▲</button>
    </div>
    <div class="drawer-body">
      <textarea id="out" readonly></textarea>
      <div class="two" style="margin-top:10px">
        <button class="btn" id="copyList">リストをコピー</button>
        <button class="btn shu" id="copyMail">発注メール全文をコピー</button>
      </div>
      <button class="btn ghost" id="clearAll" style="margin-top:9px">選択をぜんぶ解除</button>
      <p class="note">コピーしたら、メールアプリに貼り付けて <b>dmf@mrng.info</b> へ送ってください。</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var PRESETS = ["日本文芸社","集英社","文藝春秋","光文社","幻冬舎","宝島社",
                 "PHP研究所","主婦の友社","双葉社","中央公論新社","河出書房新社","学研"];

  var picked = [];          // {title, publisher, isbn, year, manual}
  var lastQuery = "";
  var startIndex = 0;
  var seenTitles = {};

  var $ = function(id){ return document.getElementById(id); };

  /* ---------- 出版社名の正規化（比較用） ---------- */
  function norm(s){
    if(!s) return "";
    return s.replace(/株式会社|有限会社|\(株\)|（株）/g,"")
            .replace(/[\s　・,，.。'"”’\-ー－]/g,"")
            .toLowerCase();
  }

  /* ---------- プリセットのボタン ---------- */
  PRESETS.forEach(function(p){
    var b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = p;
    b.onclick = function(){ $("pub").value = p; doSearch(true); };
    $("chips").appendChild(b);
  });

  /* ---------- カウンター ---------- */
  function renderCounter(){
    var beads = $("beads");
    if(beads.children.length === 0){
      for(var i=0;i<10;i++){
        var d = document.createElement("div");
        d.className = "bead"; beads.appendChild(d);
      }
    }
    for(var j=0;j<10;j++){
      beads.children[j].className = "bead" + (j < picked.length ? " on" : "");
    }
    $("cnum").textContent = picked.length;
    $("counter").hidden = false;
  }

  /* ---------- 出力テキスト ---------- */
  function listText(){
    return picked.map(function(b,i){
      var line = (i+1) + ". " + b.title;
      var tail = [];
      if(b.isbn) tail.push("ISBN " + b.isbn);
      if(b.year) tail.push(b.year + "年");
      if(tail.length) line += "（" + tail.join(" / ") + "）";
      return line;
    }).join("\n");
  }

  function mailText(){
    var pub = lastQuery || $("pub").value.trim() || "（出版社名）";
    return [
      "中古書籍卸売販売RERERE 御中",
      "",
      "いつもお世話になっております。",
      "あごなし堂の小口と申します。",
      "",
      "追加の仕入れをお願いしたく、ご連絡いたしました。",
      "",
      "【ご希望の書籍】",
      pub + "　" + picked.length + "冊",
      "",
      listText(),
      "",
      "上記と同じものが難しい場合は、" + pub + "発行の書籍で",
      "代替のご提案をいただけますと助かります。",
      "",
      "Amazonの出品許可申請に使用いたしますので、",
      "請求書には下記の弊社情報をご記載願います。",
      "",
      "　あごなし堂　小口 敦志",
      "　〒381-2203",
      "　長野県長野市真島町川合777番地1",
      "",
      "在庫状況とお見積りをご連絡いただけますでしょうか。",
      "何卒よろしくお願いいたします。"
    ].join("\n");
  }

  function refreshOut(){
    renderCounter();
    $("dcount").textContent = picked.length;
    $("out").value = picked.length ? listText() : "";
    $("drawer").hidden = picked.length === 0;
  }

  /* ---------- 選択の切り替え ---------- */
  function toggle(book, el){
    var key = book.title;
    var idx = -1;
    for(var i=0;i<picked.length;i++){ if(picked[i].title === key){ idx = i; break; } }
    if(idx >= 0){
      picked.splice(idx,1);
      el && el.classList.remove("picked");
    }else{
      if(picked.length >= 10){ toast("10冊まで選べます"); return; }
      picked.push(book);
      el && el.classList.add("picked");
    }
    refreshOut();
  }

  /* ---------- 1件を描画 ---------- */
  function addSlip(book, container){
    var el = document.createElement("div");
    el.className = "slip";
    var pubOk = norm(book.publisher).indexOf(norm(lastQuery)) >= 0;
    var meta = [];
    meta.push('<span class="' + (pubOk ? "pub" : "warn") + '">' +
              esc(book.publisher || "出版社の記載なし") + '</span>');
    if(book.year) meta.push(esc(book.year) + "年");
    if(book.isbn) meta.push("ISBN " + esc(book.isbn));
    el.innerHTML =
      '<div class="no">✓</div><div class="body">' +
      '<p class="ttl">' + esc(book.title) + '</p>' +
      '<p class="meta">' + meta.join("　/　") + '</p></div>';
    el.onclick = function(){ toggle(book, el); };
    // 既に選択済みなら反映
    for(var i=0;i<picked.length;i++){
      if(picked[i].title === book.title){ el.classList.add("picked"); break; }
    }
    container.appendChild(el);
  }

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  /* ---------- 検索 ----------
     第一候補：国立国会図書館サーチ（NDL）… APIキー不要・利用制限がゆるい
     第二候補：Google Books … NDLが落ちているときの予備 */
  var PAGE = 40;

  var NS = {
    dc:      "http://purl.org/dc/elements/1.1/",
    dcndl:   "http://ndl.go.jp/dcndl/terms/",
    dcterms: "http://purl.org/dc/terms/",
    os:      "http://a9.com/-/spec/opensearchrss/1.0/"
  };
  function tagNS(el, ns, name){
    var n = el.getElementsByTagNameNS(ns, name);
    return n.length ? n[0].textContent : "";
  }

  function searchNDL(q){
    var url = "https://ndlsearch.ndl.go.jp/api/opensearch"
            + "?publisher=" + encodeURIComponent(q)
            + "&mediatype=books&cnt=" + PAGE + "&idx=" + (startIndex + 1);
    return fetch(url)
      .then(function(r){
        if(!r.ok) throw new Error("NDL HTTP " + r.status);
        return r.text();
      })
      .then(function(xml){
        var doc = new DOMParser().parseFromString(xml, "text/xml");
        if(doc.getElementsByTagName("parsererror").length) throw new Error("NDL 応答の読み取りに失敗");
        var totalEl = doc.getElementsByTagNameNS(NS.os, "totalResults");
        var total = totalEl.length ? parseInt(totalEl[0].textContent, 10) || 0 : 0;
        var items = doc.getElementsByTagName("item");
        var books = [];
        for(var i=0;i<items.length;i++){
          var it = items[i];
          var title = tagNS(it, NS.dc, "title") ||
                      (it.getElementsByTagName("title")[0] || {}).textContent || "";
          var vol = tagNS(it, NS.dcndl, "volume");
          if(vol) title += "　" + vol;
          if(!title) continue;

          var isbn = "";
          var ids = it.getElementsByTagNameNS(NS.dc, "identifier");
          for(var j=0;j<ids.length;j++){
            var ty = ids[j].getAttribute("xsi:type") || "";
            if(ty === "dcndl:ISBN13"){ isbn = ids[j].textContent; break; }
            if(!isbn && ty === "dcndl:ISBN") isbn = ids[j].textContent;
          }
          isbn = isbn.replace(/-/g,"");

          var year = (tagNS(it, NS.dcterms, "issued") || tagNS(it, NS.dc, "date"))
                       .replace(/[^0-9].*$/,"").slice(0,4);

          books.push({
            title: title,
            publisher: tagNS(it, NS.dc, "publisher"),
            isbn: isbn,
            year: year
          });
        }
        return { books: books, hasMore: startIndex + PAGE < total };
      });
  }

  function searchGoogle(q){
    var url = "https://www.googleapis.com/books/v1/volumes"
            + "?q=" + encodeURIComponent('inpublisher:"' + q + '"')
            + "&maxResults=" + PAGE + "&startIndex=" + startIndex
            + "&langRestrict=ja&country=JP&printType=books";
    return fetch(url)
      .then(function(r){
        if(!r.ok) throw new Error("Google HTTP " + r.status);
        return r.json();
      })
      .then(function(data){
        var items = data.items || [];
        var books = [];
        items.forEach(function(it){
          var v = it.volumeInfo || {};
          var title = v.title || "";
          if(v.subtitle) title += "　" + v.subtitle;
          if(!title) return;
          var isbn = "";
          (v.industryIdentifiers || []).forEach(function(id){
            if(id.type === "ISBN_13") isbn = id.identifier;
          });
          books.push({
            title: title,
            publisher: v.publisher || "",
            isbn: isbn,
            year: (v.publishedDate || "").slice(0,4)
          });
        });
        return { books: books, hasMore: items.length >= PAGE };
      });
  }

  function doSearch(reset){
    var q = $("pub").value.trim();
    if(!q){ toast("出版社名を入れてください"); return; }

    if(reset){
      lastQuery = q; startIndex = 0; seenTitles = {};
      $("results").innerHTML = ""; $("more").innerHTML = "";
    }

    $("status").innerHTML = "さがしています…";
    $("searchBtn").disabled = true;
    $("manualWrap").hidden = true;

    searchNDL(q)
      .catch(function(){ return searchGoogle(q); })
      .then(function(res){
        $("searchBtn").disabled = false;
        var box = $("results");
        var qn = norm(q);

        res.books.forEach(function(b){
          var k = norm(b.title);
          if(seenTitles[k]) return;
          // 出版社名が一致するものだけ採用（表記ゆれは正規化で吸収）
          var pn = norm(b.publisher);
          if(!pn || pn.indexOf(qn) < 0) return;
          seenTitles[k] = true;
          addSlip(b, box);
        });

        startIndex += PAGE;
        renderMore(res.hasMore, box);
      })
      .catch(function(err){
        $("searchBtn").disabled = false;
        $("status").innerHTML =
          "<strong>本の一覧を取れませんでした。</strong><br>" +
          "電波が届いていないか、検索サービスが一時的に混み合っています。<br>" +
          "少し待ってもう一度押すか、下の「手で足す」から書名を入れてください。<br>" +
          '<span style="font-size:12px;color:#8A939C">（' + esc(err.message) + "）</span>";
        $("manualWrap").hidden = false;
      });
  }

  function renderMore(hasMore, box){
    var total = box.children.length;
    $("more").innerHTML = "";

    if(total === 0 && !hasMore){
      $("status").innerHTML =
        "<strong>「" + esc(lastQuery) + "」の本が見つかりませんでした。</strong><br>" +
        "出版社名の書き方を変えると出ることがあります（例：学研 → Gakken）。<br>" +
        "見つからない場合は、下の「手で足す」から書名を直接入れてください。";
      $("manualWrap").hidden = false;
      return;
    }

    $("status").innerHTML = "「" + esc(lastQuery) + "」発行の本を <strong>" +
      total + "件</strong> 表示中。タップして10冊選んでください。";
    $("manualWrap").hidden = false;

    if(hasMore){
      var b = document.createElement("button");
      b.className = "btn ghost";
      b.textContent = "もっと読み込む";
      b.onclick = function(){ doSearch(false); };
      $("more").appendChild(b);
    }
  }

  /* ---------- 手動追加 ---------- */
  function manualAdd(){
    var t = $("manual").value.trim();
    if(!t){ return; }
    if(picked.length >= 10){ toast("10冊まで選べます"); return; }
    picked.push({title:t, publisher:lastQuery || $("pub").value.trim(), isbn:"", year:"", manual:true});
    $("manual").value = "";
    refreshOut();
    toast("追加しました");
  }

  /* ---------- コピー ---------- */
  function copy(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text)
        .then(function(){ toast("コピーしました"); })
        .catch(function(){ fallbackCopy(text); });
    }else{ fallbackCopy(text); }
  }
  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    try{ document.execCommand("copy"); toast("コピーしました"); }
    catch(e){ toast("コピーできませんでした。長押しで選択してください"); }
    document.body.removeChild(ta);
  }

  var toastTimer;
  function toast(msg){
    var t = $("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1900);
  }

  /* ---------- イベント ---------- */
  $("searchBtn").onclick = function(){ doSearch(true); };
  $("pub").addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); doSearch(true); }
  });
  $("manualBtn").onclick = manualAdd;
  $("manual").addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); manualAdd(); }
  });
  $("dtoggle").onclick = function(){
    var d = $("drawer");
    d.classList.toggle("open");
    this.textContent = d.classList.contains("open") ? "とじる ▼" : "ひらく ▲";
  };
  $("copyList").onclick = function(){ copy(listText()); };
  $("copyMail").onclick = function(){ copy(mailText()); };
  $("clearAll").onclick = function(){
    picked = [];
    var slips = document.querySelectorAll(".slip.picked");
    for(var i=0;i<slips.length;i++){ slips[i].classList.remove("picked"); }
    refreshOut();
    $("drawer").hidden = true;
  };

  renderCounter();
  $("counter").hidden = true;
})();
</script>
</body>
</html>
